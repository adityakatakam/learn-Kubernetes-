apiVersion: v1
kind: Pod
metadata:
  name: multi-container-shared-storage
spec:
  volumes:
    - name: shared-storage
      emptyDir: {}
  containers:
    - name: demo1
      image: nginx
      volumeMounts:
        - name: shared-storage
          mountPath: /usr/share/nginx/html
    - name: demo2
      image: rkalluru/learnk8s:rhel9-bare
      volumeMounts:
        - name: shared-storage
          mountPath: /opt
          